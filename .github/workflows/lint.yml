name: lint

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe dos scripts (bash -n)
        run: |
          set -e
          for f in bootstrap.sh install.sh dotsave hooks/pre-commit rice/.config/hypr/scripts/*.sh rice/.config/shell/rice.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
          echo "py_compile style-render.py"
          python3 -m py_compile rice/.config/rice/scripts/style-render.py

      - name: ShellCheck (avisos e erros)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bootstrap.sh install.sh dotsave hooks/pre-commit \
            rice/.config/hypr/scripts/*.sh rice/.config/shell/rice.sh

      - name: JSON da Waybar/fastfetch e TOML do matugen
        run: |
          python3 - <<'PY'
          import glob, json, re, sys, tomllib

          def load_jsonc(path):
              raw = open(path, encoding="utf-8").read()
              raw = re.sub(r"^\s*//.*$", "", raw, flags=re.M)
              raw = re.sub(r",(\s*[}\]])", r"\1", raw)
              return json.loads(raw) if raw.strip() else {}

          bad = 0
          for p in glob.glob("rice/.config/waybar/**/config.jsonc", recursive=True) + \
                   glob.glob("rice/.config/rice/styles/*.json") + \
                   ["rice/.config/fastfetch/config.jsonc"]:
              try:
                  load_jsonc(p); print("ok", p)
              except json.JSONDecodeError as e:
                  print("JSON inválido:", p, e); bad = 1

          for p in ["rice/.config/matugen/config.toml"] + glob.glob("rice/.config/matugen/templates/*.toml"):
              try:
                  tomllib.load(open(p, "rb")); print("ok", p)
              except Exception as e:
                  print("TOML inválido:", p, e); bad = 1
          sys.exit(bad)
          PY

      - name: Manifestos de estilo completos
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          required = ("id", "name", "hypr", "waybar", "kitty", "fuzzel", "mako", "rofi", "hyprlock", "quickshell")
          waybar_keys = ("height", "margin_top", "margin_left", "margin_right", "opacity", "radius")
          bad = 0
          for p in sorted(glob.glob("rice/.config/rice/styles/*.json")):
              data = json.load(open(p, encoding="utf-8"))
              missing = [k for k in required if k not in data]
              if missing:
                  print("faltando em", p, ":", ", ".join(missing)); bad = 1
                  continue
              missing = [k for k in waybar_keys if k not in data["waybar"]]
              if missing:
                  print("faltando em waybar de", p, ":", ", ".join(missing)); bad = 1
              css = f"rice/.config/waybar/themes/{data['id']}/style.css"
              if not os.path.exists(css):
                  print("CSS ausente:", css); bad = 1
              else:
                  text = open(css, encoding="utf-8").read()
                  for token in ("{{opacity}}", "{{radius}}"):
                      if token not in text:
                          print("token ausente:", token, "em", css); bad = 1
              lock = f"rice/.config/hypr/lock-styles/{data['hyprlock']}.conf"
              if not os.path.exists(lock):
                  print("lock style ausente:", lock); bad = 1
              if not isinstance(data["rofi"].get("overrides"), str):
                  print("rofi.overrides deve ser string em", p); bad = 1
          sys.exit(bad)
          PY

      - name: Templates do matugen existem
        run: |
          python3 - <<'PY'
          import os, re, sys
          cfg = open("rice/.config/matugen/config.toml", encoding="utf-8").read()
          bad = 0
          for m in re.finditer(r"input_path\s*=\s*'([^']+)'", cfg):
              rel = m.group(1).replace("~/.config/", "rice/.config/")
              if os.path.exists(rel):
                  print("ok", rel)
              else:
                  print("template ausente:", rel); bad = 1
          sys.exit(bad)
          PY

      - name: Nenhum arquivo gerado no git
        run: |
          if git ls-files | grep -E '(^|/)(colors\.(lua|conf|css|ini|rasi|env)|settings\.lua|binds\.lua|logo\.txt)$|(^|/)mako/config$|\.(antes-[^/]*|bak|backup-[^/]*)$'; then
            echo "Arquivos gerados ou backups estão versionados (lista acima)."; exit 1
          fi
          echo "ok"
