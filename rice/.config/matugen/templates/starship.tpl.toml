"$schema" = 'https://starship.rs/config-schema.json'

palette = "matugen"
add_newline = true

format = """
[\ue0b6](fg:primary)$os$username[\ue0b0](fg:primary bg:surfacehigh)$directory[\ue0b4](fg:surfacehigh) $git_branch$git_status$fill$python$nodejs$rust$golang$cmd_duration$time
$character"""

[palettes.matugen]
primary = "{{colors.primary.default.hex}}"
onprimary = "{{colors.on_primary.default.hex}}"
surfacehigh = "{{colors.surface_container_high.default.hex}}"
onsurface = "{{colors.on_surface.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"
outline = "{{colors.outline.default.hex}}"

[os]
disabled = false
style = "bg:primary fg:onprimary"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "\uf303"
EndeavourOS = "\uf322"
Linux = "\uf17c"
Unknown = "\uf303"

[username]
show_always = false
style_user = "bg:primary fg:onprimary"
style_root = "bg:error fg:onprimary"
format = "[$user ]($style)"

[directory]
style = "bg:surfacehigh fg:onsurface"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "\uf418 "
style = "fg:tertiary"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:secondary"
format = "([$all_status$ahead_behind]($style) )"

[fill]
symbol = " "

[python]
symbol = "\ue606 "
style = "fg:tertiary"
format = "[$symbol($version) ]($style)"

[nodejs]
symbol = "\ue718 "
style = "fg:tertiary"
format = "[$symbol($version) ]($style)"

[rust]
symbol = "\ue7a8 "
style = "fg:tertiary"
format = "[$symbol($version) ]($style)"

[golang]
symbol = "\ue626 "
style = "fg:tertiary"
format = "[$symbol($version) ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:outline"
format = "[\uf252 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:outline"
format = "[\uf017 $time]($style)"

[character]
success_symbol = "[\u276f](bold fg:primary)"
error_symbol = "[\u276f](bold fg:error)"
