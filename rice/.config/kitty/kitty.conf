include colors.conf

font_family      JetBrainsMono Nerd Font
font_size        12.0
window_padding_width 12
background_opacity 0.5
confirm_os_window_close 0
cursor_shape beam
enable_audio_bell no
tab_bar_style powerline

# gelatina: rastro elástico no cursor
cursor_trail 3
cursor_trail_decay 0.1 0.4

# estilo dinâmico (gerado em ~/.local/state/rice)
include ~/.local/state/rice/kitty/style.conf
