source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    brightness = 0.5
}

label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 56
    outline_thickness = 2
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = $surface
    outer_color = $primary
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    placeholder_text = Senha
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}

animations {
    enabled = false
}
