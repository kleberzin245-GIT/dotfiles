source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    brightness = 0.75
    vibrancy = 0.3
}

# cartão de vidro
shape {
    monitor =
    size = 440, 330
    color = rgba(255,255,255,0.10)
    rounding = 32
    border_size = 1
    border_color = rgba(255,255,255,0.35)
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 84
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $on_surface
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 1
    rounding = 27
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = rgba(255,255,255,0.12)
    outer_color = rgba(255,255,255,0.45)
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    placeholder_text = <i>senha...</i>
    fade_on_empty = true
    position = 0, -60
    halign = center
    valign = center
}

animations {
    enabled = true
    bezier = jelly, 0.34, 1.56, 0.64, 1
    animation = fadeIn, 1, 5, jelly
    animation = fadeOut, 1, 4, jelly
    animation = inputFieldDots, 1, 2, jelly
    animation = inputFieldWidth, 1, 5, jelly
}
