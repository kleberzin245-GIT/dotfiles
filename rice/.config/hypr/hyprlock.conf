source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $primary
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 3
    rounding = 18
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = $surface
    outer_color = $primary $tertiary 45deg
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    placeholder_text = <i>senha...</i>
    fade_on_empty = true
    position = 0, -40
    halign = center
    valign = center
}

animations {
    enabled = true
    bezier = jelly, 0.34, 1.56, 0.64, 1
    animation = fadeIn, 1, 5, jelly
    animation = fadeOut, 1, 4, jelly
    animation = inputFieldDots, 1, 2, jelly
    animation = inputFieldWidth, 1, 5, jelly
}
